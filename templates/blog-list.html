{{define "content"}}
<div class="max-w-3xl mx-auto px-6 py-12">
    <h1 class="text-4xl font-extrabold tracking-tight mb-8">Blog</h1>
    {{if .Posts}}
    <div class="space-y-8">
        {{range .Posts}}
        <article class="border-b border-zinc-100 pb-6 last:border-0">
            <h2 class="text-2xl font-bold">
                <a href="/blog/{{.Slug}}.html" class="text-zinc-900 hover:text-emerald-600 transition">{{.Title}}</a>
            </h2>
            <time class="text-sm text-zinc-400">{{.Date}}</time>
        </article>
        {{end}}
    </div>
    {{else}}
    <p class="text-zinc-500">No posts yet.</p>
    {{end}}
</div>
{{end}}
