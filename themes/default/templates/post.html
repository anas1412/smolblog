{{define "content"}}
<article class="max-w-3xl mx-auto px-6 py-12">
    <header class="mb-8">
        <a href="{{siteURL}}/blog/" class="text-sm text-emerald-600 hover:text-emerald-700 transition">&larr; Back to Blog</a>
        <h1 class="text-4xl font-extrabold tracking-tight mt-4 mb-2">{{.Title}}</h1>
        <time class="text-sm text-zinc-400">{{.Date}}</time>
        <hr class="mt-6 border-zinc-200">
    </header>
    <div class="content">
        {{.HTMLBody}}
    </div>
</article>
{{end}}
