{{define "shared-head"}}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
    /* Content typography — replaces `prose` from @tailwindcss/typography */
    .content { color: #18181b; line-height: 1.75; }
    .content h1 { font-size: 2.25rem; font-weight: 800; line-height: 1.2; margin-top: 2.5rem; margin-bottom: 1rem; letter-spacing: -0.025em; }
    .content h2 { font-size: 1.875rem; font-weight: 700; line-height: 1.3; margin-top: 2rem; margin-bottom: 0.75rem; letter-spacing: -0.025em; }
    .content h3 { font-size: 1.5rem; font-weight: 600; line-height: 1.4; margin-top: 1.75rem; margin-bottom: 0.5rem; }
    .content h4 { font-size: 1.25rem; font-weight: 600; line-height: 1.5; margin-top: 1.5rem; margin-bottom: 0.5rem; }
    .content p { margin-bottom: 1.25rem; }
    .content a { color: #059669; text-decoration: underline; }
    .content a:hover { color: #047857; }
    .content strong { font-weight: 600; }
    .content em { font-style: italic; }
    .content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.25rem; }
    .content ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1.25rem; }
    .content li { margin-bottom: 0.25rem; }
    .content li > ul, .content li > ol { margin-top: 0.25rem; margin-bottom: 0; }
    .content blockquote { border-left: 3px solid #10b981; padding-left: 1rem; color: #52525b; margin: 1.5rem 0; font-style: italic; }
    .content code { background: #f4f4f5; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875em; font-family: ui-monospace, monospace; }
    .content pre { background: #18181b; color: #f4f4f5; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1.25rem; font-size: 0.875em; line-height: 1.5; }
    .content pre code { background: transparent; padding: 0; border-radius: 0; font-size: inherit; color: inherit; }
    .content hr { border: none; border-top: 1px solid #e4e4e7; margin: 2rem 0; }
    .content table { width: 100%; border-collapse: collapse; margin: 1.25rem 0; font-size: 0.875em; }
    .content th, .content td { border: 1px solid #d4d4d8; padding: 0.5rem 0.75rem; text-align: left; vertical-align: top; }
    .content th { background: #f4f4f5; font-weight: 600; }
    .content img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 1.25rem 0; }
    .content input[type="checkbox"] { margin-right: 0.375rem; accent-color: #10b981; }
</style>
{{end}}
